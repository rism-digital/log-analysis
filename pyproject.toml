[project]
name = "log-analysis"
version = "0.1.0"
description = ""
authors = [{ name = "Andrew Hankinson", email = "andrew.hankinson@gmail.com" }]
requires-python = "~=3.11"
readme = "README.md"
dependencies = [
    "ujson>=5.9.0,<6",
    "netaddr>=1.2.1,<2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "ipython>=9,<10",
    "mypy>=1.15.0",
    "pip>=25.0.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling", "pip"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # pycodestyle warnings
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    ## Flake8 plugins
    "UP",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C",
    # flake8-django
    "DJ",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

ignore = [
    # Ignore Pycodestyle line-length warnings, (mainly long comments).
    "E501",
    # Ignore McCabe complexity (for now).
    "C901",
]
